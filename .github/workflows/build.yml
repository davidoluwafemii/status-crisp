name: Build StatusCrisp Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files & Set MinSDK 24
        run: |
          flutter create --platforms=android --org com.wonderways.statuscrisp .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK (arm64 for Modern Android Phones)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusCrisp-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
