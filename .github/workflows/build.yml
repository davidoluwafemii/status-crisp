name: Build StatusCrisp Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files & Enforce SDK 24
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --platforms=android --org com.wonderways.statuscrisp --project-name status_crisp .
          rm -rf test
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

          # Enforce minSdk 24 across both Groovy and Kotlin DSL Gradle files
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk = 24/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          fi

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Release APK (arm64 for Modern Android Phones)
        run: flutter build apk --release --no-shrink --target-platform android-arm64

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusCrisp-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
